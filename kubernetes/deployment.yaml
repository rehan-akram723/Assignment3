apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-inference-deployment
  namespace: mlops
  labels:
    app: churn-inference-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-inference-api
  template:
    metadata:
      labels:
        app: churn-inference-api
    spec:
      containers:
      - name: inference-service
        image: churn-inference-api:v1.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: inference-api-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
