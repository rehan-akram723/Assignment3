[project]
name = "assignment-03-mlops-agent"
version = "0.1.0"
description = "Production-ready MLOps AI Agent"
authors = [
    { name = "Rehan Akram", email = "i230500@isb.nu.edu.pk" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "mlflow>=2.11.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", ".venv", "mlruns"]
